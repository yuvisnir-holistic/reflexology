function iqInp(id,label,ph){ return `<div class="iq-item"><label class="iq-lbl" for="iq_${id}">${label}</label><input type="text" id="iq_${id}" data-k="${id}"${ph?` placeholder="${ph}"`:""}></div>`; }
function iqExtra(){
  let h = `<div class="iq-item"><span class="iq-lbl">עוד תלונות שלא הופיעו ברשימה, אם יש</span><div class="iq-xhead"><span>פירוט</span><span>ממתי</span><span>איך טופל עד היום</span><span>כמה מפריע</span></div>`;
  [1,2,3].forEach(n=>{ h += `<div class="iq-xrow">
    <input type="text" data-k="x${n}_what" aria-label="תלונה ${n}: פירוט" placeholder="פירוט">
    <input type="text" data-k="x${n}_since" aria-label="תלונה ${n}: ממתי" placeholder="ממתי">
    <input type="text" data-k="x${n}_treat" aria-label="תלונה ${n}: איך טופל" placeholder="איך טופל">

}
function iqHistory(){

/* ---- builders ---- */
function iqTag(tags){ return tags&&tags.length ? `<span class="iq-tg">${tags.map(t=>`<i class="${t}">${IQ_EL[t].name}</i>`).join("")}</span>` : ""; }
function iqTA(id,label,lines){ return `<div class="iq-item"><label class="iq-lbl" for="iq_${id}">${label}</label><textarea id="iq_${id}" data-k="${id}" rows="${lines||2}"></textarea><div class="iq-print-lines" data-for="${id}" style="--ph:${(lines||2)*24}px"></div></div>`; }
function iqChecks(items, cls, extra){ return `<div class="iq-opts ${cls||""}" ${extra||""}>${items.map(it=>`<label class="iq-opt"><input type="checkbox" data-c="${it.id}"><span>${it.label}${iqTag(it.tags)}${iqAlt(it)}${iqSefTag(it)}${it.floor?`<span class="iq-tg"><i class="floor">${it.floor}</i></span>`:""}</span></label>`).join("")}</div>`; }
function iqRadios(name, pairs){ return `<div class="iq-opts">${pairs.map(([v,l])=>`<label class="iq-opt"><input type="radio" name="iq_${name}" value="${v}" data-r="${name}"><span>${l}</span></label>`).join("")}</div>`; }
function iqScale(id,lo,hi){ let h=`<div class="iq-scale" data-scale="${id}"><span class="end">${lo}</span>`; for(let i=0;i<=10;i++) h+=`<button type="button" class="iq-sc" data-sv="${i}">${i}</button>`; return h+`<span class="end">${hi}</span></div>`; }

function iqBind(){
  const S = iqS(), f = document.getElementById('iqForm');
  f.querySelectorAll('[data-k]').forEach(el=>{
    if(el.type==="date" && S[el.dataset.k]){ const iso=iqToIso(S[el.dataset.k]); if(iso!==S[el.dataset.k]){ S[el.dataset.k]=iso; } }
    el.value = S[el.dataset.k]||""; iqSyncPrint(el.dataset.k);
    el.addEventListener('input', ()=>{ if(iqBlank) return; S[el.dataset.k]=el.value; if(!el.value) delete S[el.dataset.k]; iqSyncPrint(el.dataset.k); iqRefreshOpts(); iqStore(); });
  });
  f.querySelectorAll('[data-c]').forEach(el=>{
    el.checked = !!S[el.dataset.c];
    el.addEventListener('change', ()=>{
      if(iqBlank){ el.checked=false; return; }
      const lim = el.closest('[data-lim]');
      if(el.checked && lim){
        const n = lim.querySelectorAll('input:checked').length;
        const mx = lim.dataset.lim==="sef" ? IQ_SEF_MAX : lim.dataset.lim==="sefl" ? 7 : IQ_EMO_MAX;
        if(n > mx){ el.checked=false; bmToast(`אפשר לבחור עד ${mx}`); return; }
      }
      if(el.checked) S[el.dataset.c]=true; else delete S[el.dataset.c];
      iqRefreshOpts(); iqStore();
    });
  });
  f.querySelectorAll('[data-r]').forEach(el=>{
    el.checked = S[el.dataset.r]===el.value;
    el.addEventListener('click', ()=>{
      if(iqBlank){ el.checked=false; return; }
      if(S[el.dataset.r]===el.value){ el.checked=false; delete S[el.dataset.r]; } else S[el.dataset.r]=el.value;
      iqRefreshOpts(); iqKindClass(); iqStore();
    });
  });
  f.querySelectorAll('[data-scale]').forEach(w=>{
    const k=w.dataset.scale, paint=()=>w.querySelectorAll('.iq-sc').forEach(x=>x.classList.toggle('on', S[k]!==undefined && String(S[k])===x.dataset.sv));
    paint();
    w.querySelectorAll('.iq-sc').forEach(b=>b.addEventListener('click', ()=>{ if(iqBlank) return; if(String(S[k])===b.dataset.sv) delete S[k]; else S[k]=Number(b.dataset.sv); paint(); iqStore(); }));
  });
  f.querySelectorAll('[data-tri]').forEach(w=>{
    const k=w.dataset.tri, paint=()=>w.querySelectorAll('button').forEach(x=>x.classList.toggle('on', S[k]===x.dataset.tv));

/* ---- analysis ---- */
function iqTally(S){
  const body={fire:0,water:0,air:0,earth:0}, emo={fire:0,water:0,air:0,earth:0}, nat={fire:0,water:0,air:0,earth:0};
  IQ_SENS.forEach(t=>{ if(S[t.id]) t.tags.forEach(e=>body[e]++); });
  IQ_BODY.forEach(g=>g.items.forEach(it=>{ if(S[it.id]) it.tags.forEach(e=>body[e]++); }));
  IQ_SOUL.forEach(it=>{ if(S[it.id]) it.tags.forEach(e=>emo[e]++); });
  IQ_EMO.forEach(it=>{ if(S[it.id]) it.tags.forEach(e=>emo[e]++); });
  IQ_NATURE.forEach(n=>{ if(S[n.id]) nat[S[n.id]]++; });
  return {body,emo,nat};
}
const iqLead = o => { const m=Math.max(...Object.values(o)); return m ? IQ_ORDER.filter(k=>o[k]===m) : []; };
const iqNames = a => a.map(k=>IQ_EL[k].name).join(" ו");
function iqInsights(S){
  const {body,emo,nat} = iqTally(S), out=[];
  const comb={}; IQ_ORDER.forEach(k=>comb[k]=body[k]+emo[k]);
  const lc=iqLead(comb), ln=iqLead(nat), lb=iqLead(body), le=iqLead(emo);
  if(lc.length){
    let p=`הכי הרבה סימונים, בגוף וברגש יחד, ביסוד <b>${iqNames(lc)}</b>.`;
    if(lb.length && le.length && lb.join()!==le.join()) p+=` בגוף בולט ${iqNames(lb)}, וברגש בולט ${iqNames(le)}. כדאי לבדוק אם יסוד אחד פולש למקומו של השני.`;
    out.push(["היסוד שנראה מחוץ לאיזון",p]);
  }
  const an = Object.values(nat).reduce((a,b)=>a+b,0);
  if(an){
    let p = ln.length===1 && nat[ln[0]]>=3 ? `נראה שהיסוד הבולט מלידה הוא <b>${IQ_EL[ln[0]].name}</b> (${nat[ln[0]]} מתוך ${an}).` : `אין יסוד אחד בולט בשאלות על הטבע${ln.length?`, הנטייה היא ל${iqNames(ln)}`:""}. כדאי לברר בשיחה.`;
    const strongN = ln.length===1 && nat[ln[0]]>=3;
    if(strongN && lc.includes(ln[0])) p+=` היסוד הבולט מלידה הוא גם זה שהכי מסומן עכשיו, אז אפשר לבדוק עודף שלו, כשהחוזקה הופכת לחולשה.`;
    else if(strongN && lc.length && comb[ln[0]]===0) p+=` דווקא ביסוד הזה כמעט אין סימונים עכשיו, ואפשר לבדוק אם הוא חסר או מוחלש.`;
    const bodyAns = S.n5; if(bodyAns && ln.length===1 && bodyAns!==ln[0]) p+=` מבנה הגוף שסומן הוא של ${IQ_EL[bodyAns].name}.`;
    out.push(["היסוד הדומיננטי",p]);
  }
  const loc=[];
  if(S.m_side==="right") loc.push("בצד ימין, שמכוון לצד הזכרי, לעשייה, ליוזמה ולהוצאה אל הפועל, ולעיתים לדמות האב");
  if(S.m_side==="left") loc.push("בצד שמאל, שמכוון לצד הנקבי, לקבלה ולהכלה, ולעיתים לדמות האם");
  if(S.m_side==="both") loc.push("בשני הצדדים, ולכן קשור לרעיון הכללי של האיבר");
  if(S.m_fb==="front") loc.push("מלפנים, שמייצג את ההווה");
  if(S.m_fb==="back") loc.push("מאחור, שמייצג את העבר");
  const ty=[...IQ_SENS,...IQ_SOUL].filter(t=>S[t.id]&&t.tags.length).map(t=>`${t.label} (${t.tags.map(e=>IQ_EL[e].name).join(", ")}${t.alt&&t.alt.length?`, או ${t.alt.map(e=>IQ_EL[e].name).join(", ")}`:""})`);
  if(loc.length||ty.length||S.m_kind||S.m_view||S.t_numb){
    let p = S.m_kind ? `התלונה העיקרית ${{body:"בגוף",soul:"בנפש",both:"בגוף ובנפש"}[S.m_kind]}. ` : "";
    if(loc.length) p+=`היא ${loc.join(", ")}. `;
    if(ty.length) p+=`איך זה מורגש: ${ty.join(", ")}.`;
    if(S.m_point) p+=` המקום בגוף שסומן: ${iqEsc(S.m_point)}.`;
    if(S.t_numb) p+=` סומן נימול או אזור רדום. לפי הבעש"ט, מקום שכואב הוא המקום החי, ומקום רדום בלי כאב מצביע על מחלה עמוקה יותר, ולכן כדאי לברר אותו.`;
    if(S.m_view) p+=` היחס למחלה: ${{mirror:"כמראה ושיעור, וזה מצב טוב להתחלת עבודה",carry:"כמשהו שסוחבים, וכדאי לבדוק אם יש השלמה או ייאוש",hard:"כאסון, וכדאי לבדוק אם יש מטען רגשי עודף ממשקעים קודמים"}[S.m_view]}.`;
    const rel=[]; if(S.r_heat) rel.push("חום מקל, ואפשר לבדוק חוסר אש"); if(S.r_cold) rel.push("קור מקל, ואפשר לבדוק עודף אש");
    if(rel.length) p+=` ${rel.join(". ")}.`;
    out.push(["התלונה העיקרית",p]);
  }
  const pr=IQ_PRESS.filter(x=>S[x.id]); if(pr.length) out.push(["איפה הלחץ", pr.map(x=>`<b>${x.floor}</b>: ${x.key}`).join(". ")+"."]);
  const st=IQ_STMTS.filter(s=>S[s.id]==="yes"||S[s.id]==="part");
  if(st.length) out.push(["מחיצות אפשריות", st.map(s=>`${s.n} ${S[s.id]==="yes"?"":"(חלקית) "}${s.gap}, ולאן הולכים: ${s.go}`).join(". ")+". כשכמה מסומנים, מתחילים מהנתק שהכי קרוב לתלונה, ואם אין חיות, מהגוף."]);
  const rt=IQ_ROOTS.filter(r=>r.when(S));
  if(rt.length) out.push(["שורשים אפשריים", rt.map(r=>`<b>${r.name}</b>, ${r.what}. התיקון: ${r.cure}`).join(". ")+"."]);
  const life=[];
  if(S.l_sleep==="lt6") life.push("פחות משש שעות שינה");
  if(S.l_wake==="tired") life.push("קימה בעייפות");
  if(S.l_meals && S.l_meals!=="regular") life.push("ארוחות לא סדירות");
  if(S.l_water==="lt1") life.push("שתייה מועטה");
  if(S.l_move==="none") life.push("כמעט בלי פעילות גופנית");
  if(S.l_nature==="none") life.push("כמעט בלי זמן בטבע");
  { const TH={th_crit:"ביקורת, שלאורך זמן קשורה לדלקות מפרקים",th_anger:"כעס, שקשור לדלקת, לצריבה ולחום",th_resent:"טינה, שקשורה לגידולים ולמה שאוכל מבפנים",th_guilt:"אשמה, שמחפשת עונש ומובילה לכאב",th_perfect:"דרישה לשלמות ומדידה לפי מודל חיצוני, שמתאימה לסיפור על רבי זושא ולעבודה על קבלת עצמי"}; const th=IQ_THOUGHT.filter(x=>S[x.id]).map(x=>TH[x.id]); if(th.length) out.push(["דפוסי מחשבה",`${th.join(". ")}. לבדוק בזהירות, כאפשרות ולא כקביעה.`]); }
  { const area=iqAreaSef(S); if(area.length){ const marked=new Set(iqSefMarked(S).map(x=>x.sf)); out.push(["ספירות לפי אזור התלונה", area.map(a=>`${a.sf}, לפי ${a.words.join(", ")}${marked.has(a.sf)?". מתחברת למה שסומן בקשרים ובעשייה":". כדאי לשאול על "+SEF_THEME[a.sf]}`).join(". ")+"."]); } }
  { const sf=iqSefMarked(S); if(sf.length){ const by={}; sf.forEach(x=>{ (by[x.sf]=by[x.sf]||[]).push(x.dir); }); out.push(["ספירות שבולטות", Object.entries(by).map(([n,d])=>`${n} (${[...new Set(d)].join(", ")})`).join(", ") + ". לבדוק בכף הרגל ובשיחה."]); } }
  if(S.l_bed==="late") life.push("הולכים לישון אחרי חצות");
  if(S.sl_fall) life.push("קושי להירדם");
  if(S.sl_wake||S.l_wakes) life.push(`יקיצות בלילה${S.l_wakes?", "+((IQ_L2.l_wakes.find(x=>x[0]===S.l_wakes)||[])[1]||""):""}`);
  if(S.l_plate==="processed") life.push("הרבה מזון מעובד או מהיר");
  if(S.l_veg==="rare") life.push("מעט ירקות ופירות");
  if(S.l_bowel==="irregular") life.push("יציאות לא סדירות");
  if(S.l_stool==="soft") life.push("יציאות רכות");
  if(S.l_stool==="hard") life.push("יציאות קשות");
  if(S.l_stress!==undefined && S.l_stress>=7) life.push(`לחץ גבוה (${S.l_stress})`);
  if(S.l_temp==="warm") life.push("העדפה לחום, אפשר לבדוק חוסר אש");
  if(S.l_temp==="cold") life.push("העדפה לקור, אפשר לבדוק עודף אש");
  if(life.length) out.push(["קומת הגוף", life.join(", ")+"."]);
  return {body,emo,nat,out};
}

  L.push("","טבע לאורך השנים");
  IQ_NATURE.forEach(n=>{ if(S[n.id]){ const o=n.o.find(x=>x[0]===S[n.id]); L.push(`${n.q}: ${o[1]} [${IQ_EL[o[0]].name}]`); } });
  L.push("","לסיום");
  L.push(`מה הייתי עושה אילו יכולתי: ${v("c_wish")}`);
  L.push(`כישרון טבעי: ${v("c_talent")}`);
  L.push(`תחביבים וזמן פנוי: ${v("c_hobby")}`);
  L.push(`מה תמיד היה קשה: ${v("c_hard")}`);
  L.push(`העולם בתמונה אחת: ${v("c_world")}`);
  L.push(`מה ארצה שישתנה: ${v("c_goal")}`);
  L.push(`עוד: ${v("c_more")}`);
  const {body,emo,nat,out}=iqInsights(S);
  L.push("","ספירה לפי יסודות (גוף / רגש / טבע)");
  IQ_ORDER.forEach(k=>L.push(`${IQ_EL[k].name}: ${body[k]} / ${emo[k]} / ${nat[k]}`));
  out.forEach(([h,x])=>L.push(`${h}: ${x.replace(/<[^>]+>/g,"")}`));
  const clean=[];
  L.forEach(line=>{
    if(line===""){ if(clean.length && clean[clean.length-1]!=="") clean.push(""); return; }
    let l=line.split(" | ").map(s=>s.trim().replace(/(^|,\s*)[^,:()]+:\s*(?=,|$)/g,"$1").replace(/^[,\s]+|[,\s]+$/g,"").replace(/,\s*,/g,",")).filter(s=>s && !/:\s*$/.test(s)).join(" | ");
    l=l.replace(/(^|,\s*)[^,:()]+:\s*(?=,|$)/g,"$1").replace(/^[,\s]+|[,\s]+$/g,"").replace(/,\s*,/g,",");
    if(l) clean.push(l);
  });
  const HEADS=["הערות","התלונה העיקרית","תלונות נוספות בגוף","רקע רפואי ותרופות","בקשרים ובעשייה (ספירות)","רגש ומחשבה","משפטים","אורח חיים","טבע לאורך השנים","לסיום"];
  const out2=[];
  clean.forEach((l,i)=>{ if(HEADS.includes(l) && (clean[i+1]===undefined || clean[i+1]==="")) return; if(l==="" && out2[out2.length-1]==="") return; out2.push(l); });
  return out2.join("\n").trim();
}
function iqCopyText(txt, msg){
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length); try{document.execCommand('copy'); bmToast(msg);}catch(e){bmToast('לא הצלחתי להעתיק');} ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>bmToast(msg), fb); else fb();
}
function iqCopy(){ iqCopyText(iqText(), 'הועתק. אפשר להדביק בשיחה'); }

/* ---- reading (אבחון) ---- */
let iqReadEdit = false;
function iqReadParts(text){
  const paras = String(text||"").replace(/\r/g,"").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  const idx = paras.findIndex(x=>/^[\*\s#]*למטפל בלבד/.test(x));
  return idx<0 ? {pt:paras, th:[]} : {pt:paras.slice(0,idx), th:paras.slice(idx)};
}
function iqParaHTML(x){
  let h = iqEsc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*/,"").replace(/\n/g,"<br>");
  return `<p>${h}</p>`;
}
function renderReading(){
  const p=curP(), wrap=document.getElementById('iqWrap'); if(!p||!wrap) return;
  wrap.className='';
  const r = p.reading || null;
  if(!r || !r.text || iqReadEdit){
    wrap.innerHTML = `
      <p class="iq-hint no-print">הדביקו כאן את האבחון. מה שמופיע אחרי פסקה שמתחילה במילים "למטפל בלבד" יישמר בנפרד, ולא יודפס בגרסה למטופל.</p>
      <textarea class="iq-read-in no-print" id="iqReadIn" placeholder="הדבקת האבחון">${iqEsc(r&&r.text||"")}</textarea>
      <div class="sheet-actions no-print" style="margin-top:10px">
        <button class="bm-btn" onclick="iqReadSave()">שמירה</button>
        ${r&&r.text ? `<button class="bm-link" onclick="iqReadEdit=false;renderReading()">ביטול</button>` : ''}
      </div>`;
    return;
  }
  const {pt,th} = iqReadParts(r.text);
  wrap.innerHTML = `
    <div class="sheet-actions no-print">
      <button class="bm-btn" onclick="iqReadPrint(true)">הדפסה למטופל</button>
      <button class="bm-btn ghost" onclick="iqReadPrint(false)">הדפסה מלאה</button>
      <button class="bm-btn ghost" onclick="iqCopyText(curP().reading.text,'הועתק')">העתקה</button>
      <button class="bm-link" onclick="iqReadEdit=true;renderReading()">עריכה</button>
      <button class="bm-link danger" onclick="iqReadDelete()">מחיקת האבחון</button>
    </div>
    <div class="paper iq-read" id="iqRead">
      <div class="paper-h"><span class="paper-name">${iqEsc(p.name)}</span><span class="iq-read-date">${iqEsc(r.date||"")}</span></div>
      <p class="paper-brand">יובל שניר, רפלקסולוג ומטפל הוליסטי</p>
      <div style="margin-top:14px">${pt.map(iqParaHTML).join("")}</div>
      ${th.length ? `<div class="iq-thera-part"><div class="iq-tp-h">למטפל בלבד</div>${th.map((x,i)=>iqParaHTML(i===0?x.replace(/^[\*\s#]*למטפל בלבד[\*\s:,.]*/,""):x)).join("")}</div>` : ''}
    </div>`;
}
function iqReadSave(){
  const p=curP(), v=document.getElementById('iqReadIn').value.trim();
  if(!v){ bmToast('אין מה לשמור'); return; }
  p.reading = {text:v, date:(p.reading&&p.reading.date)||today()};
  iqReadEdit=false; savePT(); renderSheet(); bmToast('האבחון נשמר');
}
function iqReadDelete(){ const p=curP(); if(!confirm(`למחוק את האבחון של ${p.name}?`)) return; delete p.reading; savePT(); renderSheet(); }
function iqReadPrint(patientOnly){
  const w=document.getElementById('iqWrap');
  if(patientOnly){ w.classList.add('iq-print-patient'); const back=()=>{ w.classList.remove('iq-print-patient'); window.removeEventListener('afterprint',back); }; window.addEventListener('afterprint',back); }
  setTimeout(()=>window.print(), 30);
}
/* ===== חלקים מתקפלים בשאלון ===== */
const IQ_ACC = {};
function iqAccKey(wizard){ try{ if(typeof curP==='function'){ const p=curP(); if(p) return p.intakeMode || (iqHas(p) ? 'full' : 'lean'); } }catch(e){} return 'pt'; }
function iqAcc(root, wizard){
  if(!root) return;
  const key = iqAccKey(wizard);
  const secs = [...root.querySelectorAll(':scope > section.iq-q')];
  if(!IQ_ACC[key]) IQ_ACC[key] = new Set([0]);
  const open = IQ_ACC[key];
  secs.forEach((sec,i)=>{
    const h3 = sec.querySelector(':scope > h3'); if(!h3) return;
    sec.classList.add('iq-acc');
    const body = document.createElement('div'); body.className = 'iq-acc-b';
    [...sec.childNodes].forEach(n=>{ if(n!==h3) body.appendChild(n); });
    const btn = document.createElement('button'); btn.type='button'; btn.className='iq-acc-h';
    btn.innerHTML = `<span class="t">${h3.textContent}</span><span class="c"></span><span class="ch" aria-hidden="true"></span>`;
    sec.insertBefore(btn, h3); sec.appendChild(body);
    if(wizard && i===secs.length-1){
      const fin = document.createElement('button'); fin.type='button'; fin.className='bm-btn iq-acc-next';
      const inClinic = typeof curP==='function';
      fin.textContent = inClinic ? 'סיום ושמירה' : 'לשליחה';
      fin.onclick = ()=>{ open.clear(); iqAccApply(root,key); if(inClinic){ window.scrollTo({top:0,behavior:'smooth'}); if(typeof bmToast==='function') bmToast('השאלון נשמר'); } else { const snd=document.querySelector('.send'); if(snd) iqAccScroll(snd); } };
      body.appendChild(fin);
    }
    if(wizard && i<secs.length-1){
      const nx = document.createElement('button'); nx.type='button'; nx.className='bm-btn iq-acc-next';
      nx.textContent = 'לחלק הבא: ' + (secs[i+1].querySelector(':scope > h3')||{}).textContent;
      nx.onclick = ()=>{ open.clear(); open.add(i+1); iqAccApply(root,key); iqAccScroll(secs[i+1]); };
      body.appendChild(nx);
    }
    btn.onclick = ()=>{
      const was = open.has(i);
      if(wizard){ open.clear(); if(!was) open.add(i); } else { if(was) open.delete(i); else open.add(i); }
      iqAccApply(root,key); if(!was) iqAccScroll(sec);
    };
  });
  const recount = ()=>setTimeout(()=>iqAccCount(root),0);
  root.addEventListener('input', recount); root.addEventListener('change', recount); root.addEventListener('click', recount);
  iqAccApply(root,key); iqAccCount(root);
}
function iqAccApply(root,key){
  [...root.querySelectorAll(':scope > section.iq-acc')].forEach((sec,i)=>{
    const on = IQ_ACC[key].has(i); sec.classList.toggle('open', on);
    const b = sec.querySelector(':scope > .iq-acc-h'); if(b) b.setAttribute('aria-expanded', on);
  });
}
function iqAccScroll(sec){ const y = sec.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({top:y, behavior:'smooth'}); }
function iqAccCount(root){
  root.querySelectorAll(':scope > section.iq-acc').forEach(sec=>{
    let n = 0;
    sec.querySelectorAll('[data-k]').forEach(el=>{ if(el.value && String(el.value).trim()) n++; });
    n += sec.querySelectorAll('input[data-c]:checked, input[data-r]:checked, .iq-sc.on, .iq-tri button.on').length;
    const c = sec.querySelector(':scope > .iq-acc-h .c'); if(c) c.textContent = n ? (n===1?'תשובה אחת':n+' תשובות') : '';
  });
}

function addPrintLogos(){
  document.querySelectorAll('#cardBody #iqRead, #cardBody .rd-sheet, #cardBody .wk-paper').forEach(pp=>{
    pp.classList.add('pr-paper');
    if(!pp.querySelector(':scope > .pr-logo')) pp.insertAdjacentHTML('afterbegin', `<img class="pr-logo print-only" src="${LOGO_SRC}" alt="יובל שניר, רפלקסולוג ומטפל הוליסטי">`);
  });
}
/* ===================== אבחון ותרגול יחד, למטופל ===================== */
function readRecs(p){
  const text = (p && p.reading && p.reading.text) || '';
  if(!text) return [];
  const {th} = iqReadParts(text); const thText = th.join('\n');
  const byTitle = {};
  Object.values(EXR).forEach(e=>{
    if(!e.title || e.title.length<3) return;
    const quoted = ['"'+e.title+'"', '״'+e.title+'״', '“'+e.title+'”', '”'+e.title+'“'].some(q=>text.includes(q));
    const plain = e.title.length>=6 && thText.includes(e.title);
    if(!quoted && !plain) return;
    const cur = byTitle[e.title];
    if(!cur || (!text.includes(cur.srcLabel) && text.includes(e.srcLabel))) byTitle[e.title] = e;
  });
  return Object.values(byTitle).map(e=>e.id);
}
function curWi(p){ return (p.activeWeek!=null && p.activeWeek<p.weeks.length) ? p.activeWeek : p.weeks.length-1; }
function lastWeekItems(p){ const w = p.weeks[curWi(p)]; return (w.items||[]).filter(id=>EXR[id]); }
function sheetTextFor(p, wi){
  const w = p.weeks[wi]; const items = w.items.filter(id=>EXR[id]);
  let t = `עבודה פנימית בין המפגשים, מפגש ${wi+1}\nחמש עד עשר דקות ביום, בזמן קבוע אם אפשר.\n\n`;
  items.forEach((id,i)=>{ t += `${i+1}. ${EXR[id].title}\n${EXR[id].why?'למה: '+EXR[id].why+'\n':''}${EXR[id].text}\n\n`; });
  if(w.note) t += w.note + '\n\n';
  const qs = weekQs(items);
  return t + 'לרישום, ולהביא למפגש הבא:\n' + (qs.length ? qs.join('\n') : 'מה עבד, מה היה קשה, ומה התגלה?');

function sheetPaperFor(p, wi){

    if(ptBox) ptBox.insertAdjacentHTML('afterend', html); else if(paper) paper.insertAdjacentHTML('beforeend', html);

/* הדפסה: ברירת המחדל היא למטופל בלבד. החלק של המטפל מודפס רק ב"הדפסה מלאה" */

/* ===================== החלק למטפל: כרטיסים מתקפלים, קישורים ותרגילים ===================== */
let rdOpen = new Set(), rdOpenEx = new Set(), rdLastP = null;
const RD_EL = {'אש':'fire','מים':'water','אוויר':'air','רוח':'air','אדמה':'earth','עפר':'earth'};
function rdPlain(s){ return s.replace(/\*\*/g,'').replace(/^#+\s*/,'').trim(); }
function rdFirstWords(s){ const w = rdPlain(s).split(/\s+/); return w.slice(0,7).join(' ') + (w.length>7?'…':''); }
function rdHead(par){
  const raw = par.trim(), lines = raw.split('\n'), first = lines[0].trim(), pf = rdPlain(first);
  const shortNoStop = pf.length<=55 && !/[.?!]$/.test(pf);
  if(/^\*\*[^*]+\*\*:?$/.test(first) || /^#+\s/.test(first) || (shortNoStop && /:$/.test(pf)) || (shortNoStop && lines.length===1))
    return {title:pf.replace(/:$/,''), rest:lines.slice(1).join('\n').trim(), kind:'head'};
  if(shortNoStop && lines.length>1) return {title:pf.replace(/:$/,''), rest:lines.slice(1).join('\n').trim(), kind:'head'};
  const m = raw.match(/^\**([^.:\n*]{2,45}?)\**:\s+/);
  if(m) return {title:m[1].trim(), rest:raw.slice(m[0].length), kind:'lead'};
  return null;
}
function rdCards(th){
  const paras = th.map((x,i)=>i===0 ? x.replace(/^[\*\s#]*למטפל בלבד[\*\s:,.]*/,'') : x).map(s=>s.trim()).filter(Boolean);
  const cards = [];
  paras.forEach(par=>{
    const h = rdHead(par);
    if(h){ cards.push({title:h.title, paras:h.rest?[h.rest]:[], kind:h.kind}); return; }
    const last = cards[cards.length-1];
    if(last && last.kind==='head') last.paras.push(par);
    else cards.push({title:rdFirstWords(par), paras:[par], kind:'lead'});
  });
  return cards.filter(c=>c.paras.length || c.kind==='lead');
}
/* קישורים בתוך הטקסט: תרגילים, יסודות וספירות */
function rdLinkify(text, recs, found){
  const slots = [];
  const put = html => { slots.push(html); return '\u0001'+(slots.length-1)+'\u0001'; };
  recs.forEach(id=>{
    const t = EXR[id].title;
    ['"'+t+'"','״'+t+'״','“'+t+'”','”'+t+'“'].forEach(q=>{
      if(text.includes(q)){ found.ex.add(id); text = text.split(q).join(put(`<button type="button" class="rd-link ex" onclick="rdJump('${id}')">${escH(t)}</button>`)); }
    });
  });
  text = text.replace(/יסוד ה(אש|מים|אוויר|רוח|אדמה|עפר)/g, (m,w)=>{ const k=RD_EL[w]; found.el.add(k); return put(`<button type="button" class="rd-link el" onclick="exOpenAt('el','${k}')">${m}</button>`); });
  text = text.replace(/ספירת ([א-ת]+)/g, (m,w)=>{ if(!WEEK_SF[w]) return m; found.sf.add(w); return put(`<button type="button" class="rd-link sf" onclick="exOpenAt('sf','${w}')">${m}</button>`); });
  text = text.replace(/ספירות ((?:[א-ת]+(?:,\s*|\s+ו|\s+)?){1,6})/g, (m,list)=>{
    return 'ספירות ' + list.replace(/(^|[\s,]+)(ו?)([א-ת]+)/g, (mm,sep,vav,w)=>{
      if(!WEEK_SF[w]) return mm; found.sf.add(w);
      return sep+vav+put(`<button type="button" class="rd-link sf" onclick="exOpenAt('sf','${w}')">${w}</button>`);
    });
  });
  let html = iqParaHTML(text);
  html = html.replace(/\u0001(\d+)\u0001/g, (m,i)=>slots[+i]);
  return html;
}
function rdExHTML(id, w){
  const e = EXR[id]; const on = w.items.includes(id);
  return `<details class="rd-ex" data-ex="${id}" ${rdOpenEx.has(id)?'open':''} ontoggle="rdExTog('${id}',this.open)">
    <summary><span class="rd-ex-t">${escH(e.title)}<span class="ex-src">${escH(e.srcLabel)}${e.floor?', '+floorLabel(e.floor):''}${(typeof EX_AUD_LABEL!=='undefined')?` <span class="aud-tag aud-${e.aud||'all'}">${EX_AUD_LABEL[e.aud||'all']}</span>`:''}</span></span>
      <button type="button" class="add-btn no-print ${on?'on':''}" onclick="event.preventDefault();event.stopPropagation();rdAdd('${id}')">${on?'בתרגול ✓':'הוספה לתרגול'}</button></summary>
    ${e.why?`<p class="ex-why">${escH(e.why)}</p>`:''}<p>${escH(e.text)}</p></details>`;
}
function rdBuild(){
  const p = curP(); const paper = $('iqRead'); if(!p || !paper) return;
  const box = paper.querySelector('.iq-thera-part'); if(!box) return;
  if(rdLastP !== p.id){ rdOpen = new Set(); rdOpenEx = new Set(); rdLastP = p.id; }
  const {th} = iqReadParts(p.reading.text);
  const recs = readRecs(p); const w = p.weeks[curWi(p)];
  const cards = rdCards(th).reduce((acc,c)=>{
    /* "להתחלה" ו"אפשרויות נוספות" הם חלק מכרטיס התרגילים, ולא כרטיסים נפרדים */
    if(acc.length && /^(להתחלה|אפשרויות נוספות)/.test(c.title.trim()) && /תרגיל/.test(acc[acc.length-1].title)){ acc[acc.length-1].paras.push(`**${c.title}:** `+(c.paras[0]||''), ...c.paras.slice(1)); }
    else acc.push(c);
    return acc;
  }, []); const used = new Set();
  const cardHTML = cards.map((c,i)=>{
    const found = {ex:new Set(), el:new Set(), sf:new Set()};
    let body = c.paras.map(x=>rdLinkify(x, recs, found)).join('');
    const isEx = /תרגיל/.test(c.title), isFocus = /מיקוד/.test(c.title);
    if(isFocus && (found.el.size || found.sf.size)){
      body += `<div class="rd-chips no-print"><span>לתרגילים של:</span>${[...found.el].map(k=>`<button type="button" class="wchip" style="background:${ELEMENTS[k].bg};color:${ELEMENTS[k].color}" onclick="exOpenAt('el','${k}')">יסוד ה${EX_EL_NAMES[k]}</button>`).join('')}${[...found.sf].map(n=>`<button type="button" class="wchip" style="background:var(--sefirah-bg);color:var(--sefirah)" onclick="exOpenAt('sf','${n}')">ספירת ${n}</button>`).join('')}</div>`;
    }
    let exIds = [];
    if(isEx){
      exIds = (found.ex.size ? [...found.ex] : recs).filter(id=>!used.has(id));
      exIds.forEach(id=>used.add(id));
      if(exIds.length) body += `<div class="rd-exs">${exIds.map(id=>rdExHTML(id,w)).join('')}</div>`;
    }
    const key = c.title;
    return `<details class="rd-card" data-card="${escH(key)}" ${rdOpen.has(key)?'open':''} ontoggle="rdCardTog(this)"><summary>${escH(c.title)}${isEx&&exIds.length?`<span class="rd-badge">${exIds.filter(id=>w.items.includes(id)).length} מתוך ${exIds.length} בתרגול</span>`:''}</summary><div class="rd-card-b">${body}</div></details>`;
  }).join('');
  box.innerHTML = `<div class="iq-tp-h">למטפל בלבד<button type="button" class="bm-link no-print rd-all" onclick="rdAll()">${cards.length && rdOpen.size===cards.length?'סגירת הכול':'פתיחת הכול'}</button></div>${cardHTML}`;
}
function rdCardTog(el){ const k = el.dataset.card; if(el.open) rdOpen.add(k); else rdOpen.delete(k); const b=document.querySelector('.rd-all'); if(b){ const n=document.querySelectorAll('details.rd-card').length; b.textContent = rdOpen.size===n?'סגירת הכול':'פתיחת הכול'; } }
function rdExTog(id,open){ if(open) rdOpenEx.add(id); else rdOpenEx.delete(id); }
function rdAll(){
  const ds = [...document.querySelectorAll('details.rd-card')]; const openAll = rdOpen.size !== ds.length;
  ds.forEach(d=>{ d.open = openAll; }); rdOpen = new Set(openAll ? ds.map(d=>d.dataset.card) : []);
  const b=document.querySelector('.rd-all'); if(b) b.textContent = openAll?'סגירת הכול':'פתיחת הכול';
}
function rdAdd(id){
  const p = curP(); const w = p.weeks[curWi(p)]; const i = w.items.indexOf(id);
  if(i<0) w.items.push(id); else w.items.splice(i,1);
  savePT(); const y = window.scrollY; renderReading(); window.scrollTo(0,y);
  bmToast(i<0 ? `נוסף לתרגול, מפגש ${curWi(p)+1}` : 'הוסר מהתרגול');
}
function rdJump(id){
  const d = document.querySelector(`details.rd-ex[data-ex="${id}"]`); if(!d) return;
  const card = d.closest('details.rd-card'); if(card && !card.open){ card.open = true; }
  d.open = true; rdOpenEx.add(id);
  const y = d.getBoundingClientRect().top + window.scrollY - 80; window.scrollTo({top:y, behavior:'smooth'});
}
function exOpenAt(tab, sel){
  const p = curP(); if(!p) return;
  exTab = tab; exSel[tab] = sel; exOpen();
}

const MID_CH = [['much','הקלה משמעותית'],['better','הקלה'],['same','ללא שינוי'],['worse','הרעה במצב']];
const MID_GEN = [['better','טוב יותר'],['same','ללא שינוי'],['worse','פחות טוב'],['na','לא רלוונטי']];
const MID_EX = [['yes','עזר'],['some','עזר קצת'],['no','לא עזר'],['skip','לא עשיתי']];
const MID_SIGNS = [['energy','אנרגיה'],['sleep','שינה'],['mood','מצב רוח'],['digest','עיכול']];
function midP(){ const p=curP(); if(!p.mid) p.mid={}; return p; }
function midExIds(p){ const s=new Set(); (p.weeks||[]).forEach(w=>(w.items||[]).forEach(id=>{ if(EXR[id]) s.add(id); })); return [...s]; }
function midExtras(p){ const i=p.intake||{}; const out=[]; ['x1','x2','x3'].forEach(k=>{ if((i[k+'_what']||'').trim()) out.push([k, i[k+'_what']]); }); if((i.b_other||'').trim()) out.push(['bo', i.b_other]); return out; }
function midRadios(key, pairs){ const v=(curP().mid||{})[key]; return `<div class="iq-opts">${pairs.map(([val,l])=>`<label class="iq-opt"><input type="radio" name="mid_${key}" ${v===val?'checked':''} onchange="midSet('${key}','${val}',true)"><span>${l}</span></label>`).join('')}</div>`; }
function midTA(key, label, rows){ const v=(curP().mid||{})[key]||''; return `<div class="iq-item"><label class="iq-lbl" for="mid_${key}">${label}</label><textarea id="mid_${key}" rows="${rows||2}" oninput="midSet('${key}',this.value,true)">${escH(v)}</textarea></div>`; }
function midScale(key, lo, hi){ const v=(curP().mid||{})[key]; let h=`<div class="iq-scale">`+`<span class="end">${lo}</span>`; for(let i=0;i<=10;i++) h+=`<button type="button" class="iq-sc ${String(v)===String(i)?'on':''}" onclick="midSet('${key}',${i},true);[...this.parentElement.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${i}</button>`; return h+`<span class="end">${hi}</span></div>`; }
function midSet(k, v, quiet){ const p=midP(); if(v===''||v===null) delete p.mid[k]; else p.mid[k]=v; if(!p.mid.date) p.mid.date=isoToday(); savePT(); if(!quiet) renderIntake(); }
function midHTML(p){
  const i = p.intake||{}; const m = p.mid||{}; const n = (p.treatments||[]).length;
  let h = `<div class="paper-h"><h2>שאלון אמצע</h2><span class="paper-brand">יובל שניר, רפלקסולוג ומטפל הוליסטי</span></div>`;
  h += `<p class="iq-hint" style="margin:0 0 10px">${escH(p.name)}, אחרי ${n===1?'טיפול אחד':n+' טיפולים'}. ${m.date?'מולא ב־'+fmtD(m.date)+'.':''} השאלון בודק מה השתנה מאז ההתחלה, מה עזר, ועל מה כדאי להתמקד הלאה.</p>`;
  h += `<section class="iq-q"><h3>התלונה העיקרית</h3>`;
  if((i.m_what||'').trim()) h += `<p class="iq-hint" style="margin:0 0 8px">בהתחלה נכתב: "${escH(i.m_what)}"${i.m_level!==undefined?`, בעוצמה ${escH(String(i.m_level))} מתוך 10`:''}.</p>`;
  h += `<div class="iq-item"><span class="iq-lbl">איך זה עכשיו, לעומת ההתחלה?</span>${midRadios('change', MID_CH)}</div>`;
  h += `<div class="iq-item"><span class="iq-lbl">עוצמה היום</span>${midScale('level','בכלל לא','מאוד')}</div>`;
  h += midTA('what','מה השתנה, ומתי שמת לב לשינוי?',2);
  h += `</section>`;
  const ex = midExtras(p);
  if(ex.length){ h += `<section class="iq-q"><h3>תלונות נוספות</h3>`; ex.forEach(([k,t])=>{ h += `<div class="iq-item"><span class="iq-lbl">${escH(t)}</span>${midRadios('x_'+k, MID_GEN)}</div>`; }); h += `</section>`; }
  h += `<section class="iq-q"><h3>סימנים כלליים</h3><p class="iq-hint">גם אם לא הגעת בגללם. אם זה לא נוגע לך, אפשר לסמן לא רלוונטי.</p>`;
  MID_SIGNS.forEach(([k,l])=>{ h += `<div class="iq-item"><span class="iq-lbl">${l}</span>${midRadios('g_'+k, MID_GEN)}</div>`; });
  h += `</section>`;
  const ids = midExIds(p);
  h += `<section class="iq-q"><h3>התרגול</h3>`;
  if(ids.length){ h += `<p class="iq-hint">ליד כל תרגיל: האם הוא עזר?</p>`; ids.forEach(id=>{ h += `<div class="iq-item"><span class="iq-lbl">${escH(EXR[id].title)}</span>${midRadios('ex_'+id.replace(/[^\w\u0590-\u05FF]/g,'_'), MID_EX)}</div>`; }); }
  else h += `<p class="iq-hint">עוד לא נשמרו תרגילים בלשונית התרגול.</p>`;
  h += midTA('helped','מה עזר הכי הרבה, בטיפולים או בתרגול?',2);
  h += midTA('hard','מה היה קשה, או פחות עזר?',2);
  h += `</section>`;
  h += `<section class="iq-q"><h3>החיים היום</h3>`;
  h += midTA('life','איך החיים נראים היום, לעומת ההתחלה?',2);
  h += midTA('good','מה הלך טוב בתקופה הזו?',2);
  h += midTA('less','ומה פחות?',2);
  h += midTA('style','שינויים באורח החיים: שינה, אוכל, תנועה, עבודה, קשרים',2);
  h += `<div class="iq-item"><span class="iq-lbl">רמת לחץ היום</span>${midScale('stress','מעט','הרבה')}</div>`;
  h += `</section>`;
  h += `<section class="iq-q"><h3>הלאה</h3>`;
  h += midTA('next','על מה היית רוצה שנתמקד עכשיו?',2);
  h += midTA('notes','הערות, או משהו להוסיף',1);
  h += `</section>`;
  return h;
}
function midText(p){
  const m=p.mid||{}; const i=p.intake||{}; const L=[];
  const lab=(pairs,v)=>{ const x=pairs.find(q=>q[0]===v); return x?x[1]:''; };
  L.push(`ניתוח אמצע: ${p.name}`, `תאריך שאלון האמצע: ${m.date?fmtD(m.date):''} | מספר טיפולים עד עכשיו: ${(p.treatments||[]).length}`, '');
  L.push('=== השאלון הראשון ===');
  L.push(iqHas(p) ? iqText() : 'לא מולא שאלון ראשון.');
  L.push('', '=== האבחון הקודם ===', (p.reading&&p.reading.text) ? p.reading.text : 'אין אבחון שמור.');
  L.push('', '=== יומן הטיפולים ===');
  tSorted(p).forEach((t,k)=>{
    L.push(`טיפול ${k+1}, ${fmtD(t.date)}`);
    if(t.done) L.push(`מה עשינו: ${t.done}`); if(t.foot) L.push(`בכף הרגל: ${t.foot}`);
    if(t.progress) L.push(`איך הגיע: ${PROG[t.progress]||t.progress}${t.progressNote?', '+t.progressNote:''}`);
    const wi = weekOfTreatment(p,t); const ids = wi>=0 ? p.weeks[wi].items.filter(x=>EXR[x]) : (t.exIds||[]).filter(x=>EXR[x]);
    if(ids.length) L.push(`תרגול: ${ids.map(x=>EXR[x].title).join(', ')}`);
    if(t.homework) L.push(`עוד על התרגול: ${t.homework}`); if(t.notes) L.push(`הערות: ${t.notes}`);
    L.push('');
  });
  L.push('=== שאלון האמצע ===');
  if(i.m_what) L.push(`התלונה העיקרית בהתחלה: ${i.m_what}${i.m_level!==undefined?` (עוצמה ${i.m_level}/10)`:''}`);
  L.push(`עכשיו: ${lab(MID_CH,m.change)}${m.level!==undefined?` | עוצמה היום ${m.level}/10`:''}`);
  if(m.what) L.push(`מה השתנה: ${m.what}`);
  midExtras(p).forEach(([k,t])=>{ if(m['x_'+k]) L.push(`${t}: ${lab(MID_GEN,m['x_'+k])}`); });
  L.push(`סימנים כלליים: ${MID_SIGNS.map(([k,l])=>m['g_'+k]?`${l} ${lab(MID_GEN,m['g_'+k])}`:'').filter(Boolean).join(', ')}`);
  const ex = midExIds(p).map(id=>{ const v=m['ex_'+id.replace(/[^\w\u0590-\u05FF]/g,'_')]; return v?`${EXR[id].title}: ${lab(MID_EX,v)}`:''; }).filter(Boolean);
  if(ex.length) L.push(`התרגילים: ${ex.join(' | ')}`);
  [['helped','מה עזר הכי הרבה'],['hard','מה היה קשה'],['life','החיים היום'],['good','מה הלך טוב'],['less','מה פחות'],['style','שינויים באורח החיים'],['next','על מה להתמקד'],['notes','הערות']].forEach(([k,l])=>{ if(m[k]) L.push(`${l}: ${m[k]}`); });
  if(m.stress!==undefined) L.push(`רמת לחץ היום: ${m.stress}/10${i.l_stress!==undefined?` (בהתחלה ${i.l_stress}/10)`:''}`);
  return L.join('\n');
}
function midCopy(){ const p=curP(); const t=midText(p); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>bmToast('הועתק לניתוח אמצע'), ()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); bmToast('הועתק לניתוח אמצע'); }); }
function midClear(){ const p=curP(); if(!confirm('לנקות את שאלון האמצע?')) return; p.mid={}; savePT(); renderIntake(); }

function midButton(){ const secs=document.querySelector('#iqWrap .iq-secs'); if(secs && !secs.querySelector('.mid-btn')){ secs.style.maxWidth='600px'; secs.insertAdjacentHTML('beforeend','<button class="iq-sec mid-btn" onclick="midOpen()">שאלון אמצע</button>'); } }

/* ===== אקורדיון אחיד: פתיחת כרטיס סוגרת את הכרטיס הפתוח שלידו, באנימציה ===== */
(function(){
  const DUR = 260;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isToggleHead = el => el && /toggle\(\s*['"]open['"]\s*\)/.test(el.getAttribute('onclick')||'');
  const isAccBox = el => el && el.firstElementChild && isToggleHead(el.firstElementChild);
  const bodiesOf = el => [...el.children].slice(1);
  function animClose(el, done){
    if(reduce){ done(); return; }
    const kids = bodiesOf(el).filter(k=>k.offsetHeight>0);
    kids.forEach(k=>{ k.style.height=k.scrollHeight+'px'; k.style.overflow='hidden'; k.style.transition=`height ${DUR}ms ease, opacity ${DUR}ms ease`; });
    requestAnimationFrame(()=>requestAnimationFrame(()=>kids.forEach(k=>{ k.style.height='0px'; k.style.opacity='0'; })));
    setTimeout(()=>{ done(); kids.forEach(k=>{ ['height','overflow','transition','opacity'].forEach(p=>k.style.removeProperty(p)); }); }, DUR);
  }
  function animOpen(el){
    if(reduce) return;
    bodiesOf(el).forEach(k=>{ k.classList.remove('acc-in'); void k.offsetWidth; k.classList.add('acc-in'); });
  }
  function keepInView(el){
    setTimeout(()=>{ const r=el.getBoundingClientRect(); const top = (document.querySelector('header')||{}).offsetHeight || 0;
      if(r.top < top + 8) window.scrollBy({top: r.top - top - 12, behavior: reduce?'auto':'smooth'}); }, DUR + 20);
  }
  function closeSiblings(box){
    const par = box.parentElement; if(!par) return false;
    let any = false;
    [...par.children].forEach(sib=>{ if(sib!==box && sib.classList.contains('open') && isAccBox(sib)){ any = true; animClose(sib, ()=>sib.classList.remove('open')); } });
    return any;
  }
  /* כרטיסים שנפתחים בלחיצה על הכותרת */
  document.addEventListener('click', e=>{
    const head = e.target.closest && e.target.closest('[onclick]'); if(!isToggleHead(head)) return;
    const box = head.parentElement; if(!box) return;
    setTimeout(()=>{ if(!box.classList.contains('open')) return; animOpen(box); if(closeSiblings(box)) keepInView(box); }, 0);
  });
  /* רכיבי details */
  document.addEventListener('toggle', e=>{
    const d = e.target; if(!(d instanceof HTMLDetailsElement) || !d.open || d.dataset.accBusy) return;
    const par = d.parentElement; if(!par) return;
    let any=false;
    [...par.children].forEach(sib=>{
      if(sib!==d && sib instanceof HTMLDetailsElement && sib.open){
        any=true; sib.dataset.accBusy='1';
        const kids=[...sib.children].filter(k=>k.tagName!=='SUMMARY');
        if(reduce){ sib.open=false; delete sib.dataset.accBusy; return; }
        kids.forEach(k=>{ k.style.height=k.scrollHeight+'px'; k.style.overflow='hidden'; k.style.transition=`height ${DUR}ms ease, opacity ${DUR}ms ease`; });
        requestAnimationFrame(()=>requestAnimationFrame(()=>kids.forEach(k=>{ k.style.height='0px'; k.style.opacity='0'; })));
        setTimeout(()=>{ sib.open=false; kids.forEach(k=>['height','overflow','transition','opacity'].forEach(p=>k.style.removeProperty(p))); delete sib.dataset.accBusy; }, DUR);
      }
    });
    if(any) keepInView(d);
  }, true);
})();

/* ===== סיכום לפני מפגש ===== */
function sumOpen(){
  const p=curP(); const ts=tSorted(p); const bar=document.querySelector('.log-bar'); if(!bar) return;
  let box=document.getElementById('sumBox');
  if(box){ box.remove(); return; }
  if(!ts.length){ bmToast('עוד אין טיפולים ביומן'); return; }
  const last=new Set(ts.slice(-3).map(t=>t.id));
  bar.insertAdjacentHTML('afterend', `<div id="sumBox" class="iq-import no-print" style="margin:10px 0">
    <p class="iq-hint" style="margin:0 0 8px">בחרו את המפגשים לסיכום. ההעתקה כוללת גם את התלונה העיקרית ותמצית האבחון.</p>
    <div class="iq-opts col">${ts.map((t,k)=>`<label class="iq-opt"><input type="checkbox" value="${t.id}" ${last.has(t.id)?'checked':''}><span>טיפול ${k+1}, ${fmtD(t.date)}${t.done?' | '+escH(String(t.done).slice(0,40)):''}</span></label>`).join('')}</div>
    <div class="sheet-actions" style="margin-top:8px"><button class="bm-btn" onclick="sumCopy()">העתקה לסיכום</button><button class="bm-link" onclick="document.getElementById('sumBox').remove()">סגירה</button></div>
  </div>`);
}
function sumText(p, ids){
  const i=p.intake||{}; const L=[];
  L.push(`סיכום לפני מפגש: ${p.name}`, `מספר טיפולים עד עכשיו: ${(p.treatments||[]).length}`, '');
  if(i.m_what) L.push(`התלונה העיקרית: ${i.m_what}${i.m_level!==undefined?` (עוצמה בהתחלה ${i.m_level}/10)`:''}`);
  ['x1_what','x2_what','x3_what','b_other'].forEach(k=>{ if(i[k]) L.push(`תלונה נוספת: ${i[k]}`); });
  if(i.c_goal) L.push(`מה רצה שישתנה: ${i.c_goal}`);
  if(p.reading && p.reading.text){ const t=p.reading.text; const k=t.indexOf('למטפל בלבד'); L.push('', 'תמצית האבחון:', (k>0?t.slice(k):t).slice(0,1500)); }
  if(p.mid && Object.keys(p.mid).length) L.push('', 'יש שאלון אמצע: '+((p.mid.change&&({much:'הקלה משמעותית',better:'הקלה',same:'ללא שינוי',worse:'הרעה'})[p.mid.change])||'')+(p.mid.level!==undefined?`, עוצמה ${p.mid.level}/10`:''));
  L.push('', 'המפגשים שנבחרו:');
  tSorted(p).forEach((t,k)=>{ if(!ids.includes(t.id)) return;
    L.push(`טיפול ${k+1}, ${fmtD(t.date)}`);
    if(t.done) L.push(`מה עשינו: ${t.done}`); if(t.foot) L.push(`בכף הרגל: ${t.foot}`);
    if(t.progress) L.push(`איך הגיע: ${PROG[t.progress]||t.progress}${t.progressNote?', '+t.progressNote:''}`);
    const wi=weekOfTreatment(p,t); const ex=wi>=0?p.weeks[wi].items.filter(x=>EXR[x]):(t.exIds||[]).filter(x=>EXR[x]);
    if(ex.length) L.push(`תרגול: ${ex.map(x=>EXR[x].title).join(', ')}`);
    if(t.homework) L.push(`עוד על התרגול: ${t.homework}`); if(t.notes) L.push(`הערות: ${t.notes}`);
    L.push('');
  });
  L.push('בקשה: סיכום לפני מפגש, לפי ההנחיות.');
  return L.join('\n');
}
function sumCopy(){
  const p=curP(); const ids=[...document.querySelectorAll('#sumBox input:checked')].map(x=>x.value);
  if(!ids.length){ bmToast('לא נבחרו מפגשים'); return; }
  const t=sumText(p, ids);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>bmToast('הועתק. אפשר להדביק בשיחה'),()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); bmToast('הועתק. אפשר להדביק בשיחה'); });
}

}

/* שפה לאבחון: נכנס לטקסט לניתוח */
const _iqTextKb = iqText;
iqText = function(){
  const t = _iqTextKb(); const p = curP();

  const i = t.indexOf('\n');

/* פרטים מלשונית הפרטים מופיעים גם בשאלון */
function iqFillFromDetails(store){
  const p = curP(); if(!p) return;
  const map = {f_age:'age', f_job:'job'};
  Object.entries(map).forEach(([k,d])=>{
    const v = (p[d]||'').trim(); if(!v) return;
    const el = document.getElementById('iq_'+k);
    if(store){ if(p.intake && Object.keys(p.intake).length && !p.intake[k]) p.intake[k] = v; }
    else if(el && !el.value){ el.value = v; }
  });
  if(!store){ const d = document.getElementById('iq_f_date'); if(d && !d.value) d.value = iqIsoToday(); }
}
const _renderIntakeDet = renderIntake;
renderIntake = function(){ _renderIntakeDet(); iqFillFromDetails(false); };
const _iqStoreDet = iqStore;
iqStore = function(){ iqFillFromDetails(true); _iqStoreDet(); };
const _iqTextDet = iqText;
iqText = function(){ iqFillFromDetails(true); return _iqTextDet(); };

});
