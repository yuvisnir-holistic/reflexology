<title>אתרי הקליניקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#2C5F5B; --forest-dark:#1E4744; --header:#3A6863;
  --cream:#F7F1E6; --cream-soft:#FBF7EF; --sage:#AEBFAE; --ink:#28312E; --muted:#6a756f;
  --earth:#5C6B3F; --air:#A9821F; --sefirah:#7A5C8E; --practice:#8A6D3B;
  --radius:18px; --shadow:0 2px 14px rgba(44,95,91,0.10);
  --serif:'Frank Ruhl Libre',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6;min-height:110vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--header);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.hin{max-width:900px;margin:0 auto;text-align:center}
.crown{width:34px;height:23px;color:rgba(247,241,230,.75);display:block;margin:0 auto 4px}
h1{font-weight:900;font-size:1.75rem;margin:0 0 12px;line-height:1.2}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.12);border-radius:999px;padding:4px}
.tab{flex:1 1 0;border:0;background:transparent;color:#fff;font:700 1.02rem var(--serif);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:44px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--cream-soft);color:var(--forest-dark)}
main{max-width:900px;margin:0 auto;padding:22px 16px}
.panel[hidden]{display:none}
.group{margin:0 0 24px}
.gtitle{font-weight:700;font-size:1.12rem;color:var(--forest-dark);margin:0 4px 8px;display:flex;align-items:center;gap:8px}
.gtitle::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.list{background:var(--cream-soft);border:1px solid rgba(44,95,91,0.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.list::before{content:"";position:absolute;inset:0 0 0 auto;width:4px;background:var(--c);opacity:.85}
.item{display:flex;align-items:center;gap:12px;padding:14px 18px 14px 14px;color:inherit;text-decoration:none;position:relative}
.item + .item::after{content:"";position:absolute;top:0;right:18px;left:14px;height:1px;background:rgba(174,191,174,0.5)}
.iname{flex:1;min-width:0;font-weight:700;font-size:1.12rem;color:var(--forest-dark);line-height:1.35}
a.item{transition:background .15s}
a.item:hover{background:#fff}
a.item:active{background:color-mix(in srgb,var(--c) 8%,#fff)}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);display:flex;align-items:center;justify-content:center;font:700 1.1rem 'Assistant',sans-serif}
.acts{display:flex;gap:6px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:4px 14px;border-radius:999px;font:700 .9rem 'Assistant',sans-serif;cursor:pointer;text-decoration:none;border:1.5px solid var(--forest);white-space:nowrap}
.btn.pri{background:var(--forest);color:#fff}
.btn.gh{background:transparent;color:var(--forest)}
.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--air);outline-offset:2px}
a.item:focus-visible{outline:3px solid var(--air);outline-offset:-3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--forest-dark);color:#fff;padding:10px 22px;border-radius:999px;font:700 .95rem 'Assistant',sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hin">
    <svg class="crown" viewBox="0 0 120 80" aria-hidden="true"><path d="M22 58 L18 22 L40 40 L60 14 L80 40 L102 22 L98 58 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><line x1="24" y1="70" x2="96" y2="70" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="18" cy="14" r="4" fill="currentColor"/><circle cx="60" cy="6" r="4" fill="currentColor"/><circle cx="102" cy="14" r="4" fill="currentColor"/></svg>
    <h1>אתרי הקליניקה</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-me" aria-controls="p-me" aria-selected="true">לעבודה שלי</button>
      <button class="tab" role="tab" id="t-pt" aria-controls="p-pt" aria-selected="false">מטופלים</button>
    </div>
  </div>
</header>
<main>
  <section class="panel" id="p-me" role="tabpanel" aria-labelledby="t-me"></section>
  <section class="panel" id="p-pt" role="tabpanel" aria-labelledby="t-pt" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const ME = [
  {title:'הקליניקה', c:'var(--forest)', items:[
    {f:'clinic.html', n:'הקליניקה'},
    {f:'body-map-reference.html', n:'מפת הגוף'},
    {f:'intake.html', n:'שאלון היכרות מורחב'},
    {f:'reflexology.html', n:'אבחון רפלקסולוגי'}
  ]},
  {title:'כלים לעבודה פנימית', c:'var(--practice)', items:[
    {f:'klalei-hashkata.html', n:'כללי ההשקטה'},
    {f:'shvil-hapiyus.html', n:'שביל הפיוס'},
    {f:'neshama-neshima.html', n:'נשמה ונשימה'},
    {f:'body-map-reference.html#tools', n:'אוסף התרגילים'}
  ]}
];
const PT = [
  {title:'היכרות', c:'var(--forest)', items:[
    {f:'intake.html', n:'שאלון היכרות מורחב'}
  ]},
  {title:'מידות ויסודות', c:'var(--sefirah)', items:[
    {f:'avodat-hamidot-vehayesodot.html', n:'עבודת המידות והיסודות'}
  ]},
  {title:'נשימה', c:'var(--air)', items:[
    {f:'gradual-breathing-exercise.html', n:'תרגיל נשימה הדרגתי'},
    {f:'neshama-neshima-10-weeks.html', n:'נשמה ונשימה, עשרה שבועות'}
  ]},
  {title:'השקטה והתבוננות', c:'var(--practice)', items:[
    {f:'tavnit-hitbonenut-m.html', n:'תבנית התבוננות, לשון זכר'},
    {f:'tavnit-hitbonenut-w.html', n:'תבנית התבוננות, לשון נקבה'},
    {f:'yoman-hashkata-original.html', n:'יומן השקטה, גרסה רגילה'},
    {f:'yoman-hashkata.html', n:'יומן השקטה, גרסה מתקדמת'}
  ]}
];
const esc = s => s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const urlOf = f => new URL(f, location.href).href;

function render(el, groups, share){
  el.innerHTML = groups.map(g => `
    <div class="group" style="--c:${g.c}">
      <h2 class="gtitle">${esc(g.title)}</h2>
      <div class="list">${g.items.map(it => share ? `
        <div class="item">
          <span class="iname">${esc(it.n)}</span>
          <span class="acts">
            <a class="btn gh" href="${esc(it.f)}" target="_blank" rel="noopener">פתיחה</a>
            <button class="btn pri" data-f="${esc(it.f)}" data-n="${esc(it.n)}">שיתוף</button>
          </span>
        </div>` : `
        <a class="item" href="${esc(it.f)}" target="_blank" rel="noopener">
          <span class="iname">${esc(it.n)}</span>
          <span class="chev" aria-hidden="true">‹</span>
        </a>`).join('')}
      </div>
    </div>`).join('');
}
render(document.getElementById('p-me'), ME, false);
render(document.getElementById('p-pt'), PT, true);

const toastEl = document.getElementById('toast'); let tt;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>toastEl.classList.remove('show'), 2000); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('הקישור הועתק'); }
  catch(e){ prompt('להעתקת הקישור:', text); }
}
document.getElementById('p-pt').addEventListener('click', async e => {
  const b = e.target.closest('button[data-f]'); if(!b) return;
  const url = urlOf(b.dataset.f);
  if (navigator.share && matchMedia('(pointer:coarse)').matches){
    try { await navigator.share({title: b.dataset.n, url}); } catch(err){}
  } else { copy(url); }
});

const tabs = [...document.querySelectorAll('.tab')];
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); document.getElementById(x.getAttribute('aria-controls')).hidden = !on; });
  window.scrollTo({top:0});
}));
</script>
</body>
</html>
