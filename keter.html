<title>אתרי הקליניקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#2C5F5B; --forest-dark:#1E4744; --header:#3A6863;
  --cream:#F7F1E6; --cream-soft:#FBF7EF; --sage:#AEBFAE; --ink:#28312E; --muted:#6a756f;
  --fire:#A8442B; --fire-bg:#F3E3DD;
  --water:#2F6690; --water-bg:#DFE8ED;
  --air:#A9821F; --air-bg:#F1E9D2;
  --earth:#5C6B3F; --earth-bg:#E4E7D9;
  --sefirah:#7A5C8E; --sefirah-bg:#E9E2ED;
  --practice:#8A6D3B; --practice-bg:#F2E8D5;
  --radius:18px; --shadow:0 2px 14px rgba(44,95,91,0.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Assistant',sans-serif;font-size:17px;line-height:1.6;min-height:110vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--header);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 14px}
.hin{max-width:900px;margin:0 auto}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1.7rem;margin:0 0 12px;line-height:1.2;text-align:center}
.sub{margin:2px 0 12px;font-size:0.92rem;opacity:.85}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.12);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;border:0;background:transparent;color:#fff;font:700 0.98rem 'Assistant',sans-serif;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{background:var(--cream-soft);color:var(--forest-dark)}
main{max-width:900px;margin:0 auto;padding:18px 16px}
.panel[hidden]{display:none}
.intro{color:var(--muted);font-size:0.95rem;margin:0 0 16px;text-align:justify}
.group{margin:0 0 22px}
.gtitle{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:1.15rem;color:var(--forest-dark);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.gtitle::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--forest));flex:none}
.list{background:var(--cream-soft);border:1px solid rgba(44,95,91,0.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid rgba(174,191,174,0.45)}
.item:first-child{border-top:0}
a.item{text-decoration:none;color:inherit;cursor:pointer}
a.item:hover{background:#fff}
a.item:focus-visible{outline:3px solid var(--air);outline-offset:-3px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--forest)) 14%,transparent);color:var(--c,var(--forest));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.itxt{flex:1;min-width:0}
.iname{font-weight:700;color:var(--forest-dark);font-size:1.02rem}
.idesc{color:var(--muted);font-size:0.88rem;line-height:1.45}
.acts{display:flex;gap:6px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 16px;border-radius:999px;font:700 0.92rem 'Assistant',sans-serif;cursor:pointer;text-decoration:none;border:1.5px solid var(--forest)}
.btn.pri{background:var(--forest);color:#fff}
.btn.gh{background:transparent;color:var(--forest)}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--air);outline-offset:2px}
.note{margin-top:8px;color:var(--muted);font-size:0.85rem;text-align:justify}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--forest-dark);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){
  .item.sh{flex-wrap:wrap}
  .acts{width:100%}
  .acts .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="hin">
    <h1>אתרי הקליניקה</h1>
        <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-me" aria-controls="p-me" aria-selected="true">לעבודה שלי</button>
      <button class="tab" role="tab" id="t-pt" aria-controls="p-pt" aria-selected="false">מטופלים</button>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="p-me" role="tabpanel" aria-labelledby="t-me"></section>
  <section class="panel" id="p-pt" role="tabpanel" aria-labelledby="t-pt" hidden>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const ME = [
  {title:'הקליניקה', c:'var(--forest)', items:[
    {f:'clinic.html', n:'הקליניקה'},
    {f:'body-map-reference.html', n:'מפת הגוף'},
    {f:'reflexology.html', n:'אבחון רפלקסולוגי'}
  ]},
  {title:'כלים לעבודה פנימית', c:'var(--practice)', items:[
    {f:'klalei-hashkata.html', n:'כללי ההשקטה'},
    {f:'shvil-hapiyus.html', n:'שביל הפיוס'},
    {f:'neshama-neshima.html', n:'נשמה ונשימה'},
    {f:'body-map-reference.html#tools', n:'אוסף התרגילים'}
  ]}
];
const PT = [
  {title:'היכרות', c:'var(--forest)', items:[
    {f:'intake.html', n:'שאלון היכרות מורחב'}
  ]},
  {title:'מידות ויסודות', c:'var(--sefirah)', items:[
    {f:'avodat-hamidot-vehayesodot.html', n:'עבודת המידות והיסודות'}
  ]},
  {title:'נשימה', c:'var(--air)', items:[
    {f:'gradual-breathing-exercise.html', n:'תרגיל נשימה הדרגתי'},
    {f:'neshama-neshima-10-weeks.html', n:'נשמה ונשימה, עשרה שבועות'}
  ]},
  {title:'השקטה והתבוננות', c:'var(--practice)', items:[
    {f:'tavnit-hitbonenut-m.html', n:'תבנית התבוננות, לשון זכר'},
    {f:'tavnit-hitbonenut-w.html', n:'תבנית התבוננות, לשון נקבה'},
    {f:'yoman-hashkata-original.html', n:'יומן השקטה, גרסה רגילה'},
    {f:'yoman-hashkata.html', n:'יומן השקטה, גרסה מתקדמת'}
  ]}
];
const esc = s => s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const urlOf = f => new URL(f, location.href).href;

function render(el, groups, share){
  el.insertAdjacentHTML('beforeend', groups.map(g => `
    <div class="group" style="--c:${g.c}">
      <h2 class="gtitle">${esc(g.title)}</h2>
      <div class="list">${g.items.map(it => share ? `
        <div class="item sh">
          <div class="itxt"><div class="iname">${esc(it.n)}</div></div>
          <div class="acts">
            <a class="btn gh" href="${esc(it.f)}" target="_blank" rel="noopener">פתיחה</a>
            <button class="btn pri" data-f="${esc(it.f)}" data-n="${esc(it.n)}">שיתוף</button>
          </div>
        </div>` : `
        <a class="item" href="${esc(it.f)}" target="_blank" rel="noopener">
          <div class="itxt"><div class="iname">${esc(it.n)}</div></div>
          <span class="chev" aria-hidden="true">‹</span>
        </a>`).join('')}
      </div>
    </div>`).join(''));
}
render(document.getElementById('p-me'), ME, false);
render(document.getElementById('p-pt'), PT, true);
const toastEl = document.getElementById('toast');
let tt;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>toastEl.classList.remove('show'), 2000); }

async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('הקישור הועתק'); }
  catch(e){ prompt('להעתקת הקישור:', text); }
}
document.getElementById('p-pt').addEventListener('click', async e => {
  const b = e.target.closest('button[data-f]'); if(!b) return;
  const url = urlOf(b.dataset.f);
  if (navigator.share && matchMedia('(pointer:coarse)').matches){
    try { await navigator.share({title: b.dataset.n, url}); } catch(err){}
  } else { copy(url); }
});

const tabs = [...document.querySelectorAll('.tab')];
function show(id){
  tabs.forEach(t => {
    const on = t.id === id;
    t.setAttribute('aria-selected', on);
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
  });
  window.scrollTo({top:0});
}
tabs.forEach(t => t.addEventListener('click', () => show(t.id)));
</script>
